<svg xmlns="http://www.w3.org/2000/svg" width="1566" height="712" viewBox="0 0 1566 712" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9AA1AA"/></marker></defs>
<style>
.h1{font-size:22px;font-weight:700;fill:#1F2933} .h2{font-size:13px;fill:#5B6470}
.colh{font-size:14px;font-weight:700;fill:#FFFFFF} .cols{font-size:11.5px;fill:#C9D1DA}
.row{font-size:16px;font-weight:700;fill:#1F2933} .sub{font-size:11.5px;fill:#5B6470}
.badge{font-size:10px;font-weight:700;letter-spacing:0.08em}
.title{font-size:12.5px;font-weight:700} .body{font-size:12px}
</style>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="20" y="32" class="h1">resume-tailor: what each mode accepts, stage by stage</text>
<text x="20" y="52" class="h2">Rows are modes, columns are workflow stages. Orange boxes are where the workflow stops and waits for your reply.</text>
<rect x="150" y="70" width="210" height="56" rx="8" fill="#1F2933"/><text x="255.0" y="94" class="colh" text-anchor="middle">Invocation</text><text x="255.0" y="112" class="cols" text-anchor="middle">with the listing</text><rect x="386" y="70" width="210" height="56" rx="8" fill="#1F2933"/><text x="491.0" y="94" class="colh" text-anchor="middle">Steps 1 to 3</text><text x="491.0" y="112" class="cols" text-anchor="middle">setup and match analysis</text><rect x="622" y="70" width="210" height="56" rx="8" fill="#1F2933"/><text x="727.0" y="94" class="colh" text-anchor="middle">Step 4</text><text x="727.0" y="112" class="cols" text-anchor="middle">content strategy gate</text><rect x="858" y="70" width="210" height="56" rx="8" fill="#1F2933"/><text x="963.0" y="94" class="colh" text-anchor="middle">Steps 5 to 9</text><text x="963.0" y="112" class="cols" text-anchor="middle">drafting</text><rect x="1094" y="70" width="210" height="56" rx="8" fill="#1F2933"/><text x="1199.0" y="94" class="colh" text-anchor="middle">Steps 10 and 11</text><text x="1199.0" y="112" class="cols" text-anchor="middle">HTML and audit</text><rect x="1330" y="70" width="210" height="56" rx="8" fill="#1F2933"/><text x="1435.0" y="94" class="colh" text-anchor="middle">Step 12</text><text x="1435.0" y="112" class="cols" text-anchor="middle">cover letter, optional</text>
<text x="20" y="174" class="row">Plan</text><text x="20" y="192" class="sub">default, alias step</text><rect x="150" y="146" width="210" height="180" rx="8" fill="#EAF7EE" stroke="#2E9E5B" stroke-width="1.6"/><text x="162" y="164" class="badge" fill="#2E9E5B">INPUT</text><text x="162" y="184" class="title" fill="#1F2933">/resume-tailor &lt;listing&gt;</text><text x="162" y="200" class="body" fill="#1F2933" xml:space="preserve">• Listing (required)</text><text x="162" y="216" class="body" fill="#1F2933" xml:space="preserve">• Optional: channel,</text><text x="162" y="232" class="body" fill="#1F2933" xml:space="preserve">  seniority, company context,</text><text x="162" y="248" class="body" fill="#1F2933" xml:space="preserve">  &quot;step mode&quot;</text><path d="M364 236.0 H380" stroke="#9AA1AA" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="386" y="146" width="210" height="180" rx="8" fill="#EEF4FF" stroke="#4C7BD9" stroke-width="1.6" stroke-dasharray="5 4"/><text x="398" y="164" class="badge" fill="#4C7BD9">ASKS IF NEEDED</text><text x="398" y="184" class="title" fill="#1F2933">Asks only if missing</text><text x="398" y="200" class="body" fill="#1F2933" xml:space="preserve">• Channel, seniority, location</text><text x="398" y="216" class="body" fill="#1F2933" xml:space="preserve">• Step 3 may pose one follow-</text><text x="398" y="232" class="body" fill="#1F2933" xml:space="preserve">  up question</text><path d="M600 236.0 H616" stroke="#9AA1AA" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="622" y="146" width="210" height="180" rx="8" fill="#FFF4E5" stroke="#D9822B" stroke-width="1.6"/><text x="634" y="164" class="badge" fill="#D9822B">WAITS FOR YOU</text><text x="634" y="184" class="title" fill="#1F2933">Waits for approval</text><text x="634" y="200" class="body" fill="#1F2933" xml:space="preserve">• Approve, or adjust track,</text><text x="634" y="216" class="body" fill="#1F2933" xml:space="preserve">  project count, compress or</text><text x="634" y="232" class="body" fill="#1F2933" xml:space="preserve">  cut, bold set</text><text x="634" y="248" class="body" fill="#1F2933" xml:space="preserve">• Answer the Step 3 question</text><text x="634" y="264" class="body" fill="#1F2933" xml:space="preserve">• New experience bullet goes</text><text x="634" y="280" class="body" fill="#1F2933" xml:space="preserve">  into the master CV</text><text x="634" y="296" class="body" fill="#1F2933" xml:space="preserve">• &quot;fast mode&quot; is declined here</text><path d="M836 236.0 H852" stroke="#9AA1AA" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="858" y="146" width="210" height="180" rx="8" fill="#FFF4E5" stroke="#D9822B" stroke-width="1.6"/><text x="870" y="164" class="badge" fill="#D9822B">WAITS FOR YOU</text><text x="870" y="184" class="title" fill="#1F2933">Checkpoint after 5 and 9</text><text x="870" y="200" class="body" fill="#1F2933" xml:space="preserve">• Approve or adjust Summary</text><text x="870" y="216" class="body" fill="#1F2933" xml:space="preserve">  and Skills</text><text x="870" y="232" class="body" fill="#1F2933" xml:space="preserve">• Steps 6 to 8 then run</text><text x="870" y="248" class="body" fill="#1F2933" xml:space="preserve">  straight through</text><path d="M1072 236.0 H1088" stroke="#9AA1AA" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="1094" y="146" width="210" height="180" rx="8" fill="#EEF4FF" stroke="#4C7BD9" stroke-width="1.6" stroke-dasharray="5 4"/><text x="1106" y="164" class="badge" fill="#4C7BD9">ASKS IF NEEDED</text><text x="1106" y="184" class="title" fill="#1F2933">Runs to DONE</text><text x="1106" y="200" class="body" fill="#1F2933" xml:space="preserve">• Content with no slot: asks</text><text x="1106" y="216" class="body" fill="#1F2933" xml:space="preserve">  before inventing markup</text><path d="M1308 236.0 H1324" stroke="#9AA1AA" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="1330" y="146" width="210" height="180" rx="8" fill="#FFF4E5" stroke="#D9822B" stroke-width="1.6"/><text x="1342" y="164" class="badge" fill="#D9822B">WAITS FOR YOU</text><text x="1342" y="184" class="title" fill="#1F2933">Only if you ask</text><text x="1342" y="200" class="body" fill="#1F2933" xml:space="preserve">• &quot;cover letter&quot; starts it</text><text x="1342" y="216" class="body" fill="#1F2933" xml:space="preserve">• Approve or adjust the letter</text><text x="1342" y="232" class="body" fill="#1F2933" xml:space="preserve">  before it is saved</text><text x="20" y="370" class="row">Fast</text><text x="20" y="388" class="sub">start only</text><rect x="150" y="342" width="210" height="148" rx="8" fill="#EAF7EE" stroke="#2E9E5B" stroke-width="1.6"/><text x="162" y="360" class="badge" fill="#2E9E5B">INPUT</text><text x="162" y="380" class="title" fill="#1F2933">/resume-tailor fast mode</text><text x="162" y="396" class="title" fill="#1F2933">&lt;listing&gt;</text><text x="162" y="412" class="body" fill="#1F2933" xml:space="preserve">• Only accepted here, never</text><text x="162" y="428" class="body" fill="#1F2933" xml:space="preserve">  later</text><text x="162" y="444" class="body" fill="#1F2933" xml:space="preserve">• Listing (required)</text><path d="M364 416.0 H380" stroke="#9AA1AA" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="386" y="342" width="210" height="148" rx="8" fill="#EEF4FF" stroke="#4C7BD9" stroke-width="1.6" stroke-dasharray="5 4"/><text x="398" y="360" class="badge" fill="#4C7BD9">ASKS IF NEEDED</text><text x="398" y="380" class="title" fill="#1F2933">Defaults instead of asking</text><text x="398" y="396" class="body" fill="#1F2933" xml:space="preserve">• Cold ATS, own seniority</text><text x="398" y="412" class="body" fill="#1F2933" xml:space="preserve">  call, location Unknown</text><text x="398" y="428" class="body" fill="#1F2933" xml:space="preserve">• Still poses the Step 3</text><text x="398" y="444" class="body" fill="#1F2933" xml:space="preserve">  question if needed</text><path d="M600 416.0 H616" stroke="#9AA1AA" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="622" y="342" width="210" height="148" rx="8" fill="#FFF4E5" stroke="#D9822B" stroke-width="1.6"/><text x="634" y="360" class="badge" fill="#D9822B">WAITS FOR YOU</text><text x="634" y="380" class="title" fill="#1F2933">Waits for approval</text><text x="634" y="396" class="body" fill="#1F2933" xml:space="preserve">• Approve or adjust the</text><text x="634" y="412" class="body" fill="#1F2933" xml:space="preserve">  strategy</text><text x="634" y="428" class="body" fill="#1F2933" xml:space="preserve">• Answer the Step 3 question</text><text x="634" y="444" class="body" fill="#1F2933" xml:space="preserve">• New experience bullet goes</text><text x="634" y="460" class="body" fill="#1F2933" xml:space="preserve">  into the master CV</text><path d="M836 416.0 H852" stroke="#9AA1AA" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="858" y="342" width="210" height="148" rx="8" fill="#F3F4F6" stroke="#B8BDC4" stroke-width="1.6"/><text x="870" y="360" class="badge" fill="#B8BDC4">NO INPUT</text><text x="870" y="380" class="title" fill="#5B6470">No checkpoint</text><text x="870" y="396" class="body" fill="#5B6470" xml:space="preserve">• Summary and Skills not</text><text x="870" y="412" class="body" fill="#5B6470" xml:space="preserve">  printed</text><text x="870" y="428" class="body" fill="#5B6470" xml:space="preserve">• Picks bullets and projects</text><text x="870" y="444" class="body" fill="#5B6470" xml:space="preserve">  itself, reports kept and</text><text x="870" y="460" class="body" fill="#5B6470" xml:space="preserve">  dropped</text><path d="M1072 416.0 H1088" stroke="#9AA1AA" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="1094" y="342" width="210" height="148" rx="8" fill="#F3F4F6" stroke="#B8BDC4" stroke-width="1.6"/><text x="1106" y="360" class="badge" fill="#B8BDC4">NO INPUT</text><text x="1106" y="380" class="title" fill="#5B6470">Runs to DONE</text><text x="1106" y="396" class="body" fill="#5B6470" xml:space="preserve">• Drops content with no slot</text><text x="1106" y="412" class="body" fill="#5B6470" xml:space="preserve">  and reports it</text><path d="M1308 416.0 H1324" stroke="#9AA1AA" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="1330" y="342" width="210" height="148" rx="8" fill="#FFF4E5" stroke="#D9822B" stroke-width="1.6"/><text x="1342" y="360" class="badge" fill="#D9822B">WAITS FOR YOU</text><text x="1342" y="380" class="title" fill="#1F2933">Only if you ask</text><text x="1342" y="396" class="body" fill="#1F2933" xml:space="preserve">• &quot;cover letter&quot; starts it</text><text x="1342" y="412" class="body" fill="#1F2933" xml:space="preserve">• Approve or adjust the letter</text><text x="1342" y="428" class="body" fill="#1F2933" xml:space="preserve">  before it is saved</text><text x="20" y="534" class="row">Ultrafast</text><text x="20" y="552" class="sub">start only</text><rect x="150" y="506" width="210" height="116" rx="8" fill="#EAF7EE" stroke="#2E9E5B" stroke-width="1.6"/><text x="162" y="524" class="badge" fill="#2E9E5B">INPUT</text><text x="162" y="544" class="title" fill="#1F2933">/resume-tailor ultrafast mode</text><text x="162" y="560" class="title" fill="#1F2933">&lt;listing&gt;</text><text x="162" y="576" class="body" fill="#1F2933" xml:space="preserve">• Only accepted here</text><text x="162" y="592" class="body" fill="#1F2933" xml:space="preserve">• Listing is the only input</text><path d="M364 564.0 H380" stroke="#9AA1AA" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="386" y="506" width="210" height="116" rx="8" fill="#F3F4F6" stroke="#B8BDC4" stroke-width="1.6"/><text x="398" y="524" class="badge" fill="#B8BDC4">NO INPUT</text><text x="398" y="544" class="title" fill="#5B6470">Defaults, no questions</text><text x="398" y="560" class="body" fill="#5B6470" xml:space="preserve">• Same defaults as fast mode</text><text x="398" y="576" class="body" fill="#5B6470" xml:space="preserve">• No Step 3 question</text><path d="M600 564.0 H616" stroke="#9AA1AA" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="622" y="506" width="210" height="116" rx="8" fill="#F3F4F6" stroke="#B8BDC4" stroke-width="1.6"/><text x="634" y="524" class="badge" fill="#B8BDC4">NO INPUT</text><text x="634" y="544" class="title" fill="#5B6470">Shown briefly, no gate</text><text x="634" y="560" class="body" fill="#5B6470" xml:space="preserve">• Sponsorship flag reported,</text><text x="634" y="576" class="body" fill="#5B6470" xml:space="preserve">  not asked</text><text x="634" y="592" class="body" fill="#5B6470" xml:space="preserve">• No master CV additions</text><path d="M836 564.0 H852" stroke="#9AA1AA" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="858" y="506" width="210" height="116" rx="8" fill="#F3F4F6" stroke="#B8BDC4" stroke-width="1.6"/><text x="870" y="524" class="badge" fill="#B8BDC4">NO INPUT</text><text x="870" y="544" class="title" fill="#5B6470">No checkpoint</text><text x="870" y="560" class="body" fill="#5B6470" xml:space="preserve">• Picks bullets and projects</text><text x="870" y="576" class="body" fill="#5B6470" xml:space="preserve">  itself</text><path d="M1072 564.0 H1088" stroke="#9AA1AA" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="1094" y="506" width="210" height="116" rx="8" fill="#F3F4F6" stroke="#B8BDC4" stroke-width="1.6"/><text x="1106" y="524" class="badge" fill="#B8BDC4">NO INPUT</text><text x="1106" y="544" class="title" fill="#5B6470">Runs to DONE</text><text x="1106" y="560" class="body" fill="#5B6470" xml:space="preserve">• Filename check runs before</text><text x="1106" y="576" class="body" fill="#5B6470" xml:space="preserve">  the builder dispatch</text><text x="1106" y="592" class="body" fill="#5B6470" xml:space="preserve">• Drops content with no slot</text><path d="M1308 564.0 H1324" stroke="#9AA1AA" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="1330" y="506" width="210" height="116" rx="8" fill="#FFF4E5" stroke="#D9822B" stroke-width="1.6"/><text x="1342" y="524" class="badge" fill="#D9822B">WAITS FOR YOU</text><text x="1342" y="544" class="title" fill="#1F2933">Only if you ask</text><text x="1342" y="560" class="body" fill="#1F2933" xml:space="preserve">• Never runs automatically</text><text x="1342" y="576" class="body" fill="#1F2933" xml:space="preserve">• &quot;cover letter&quot; starts it</text>
<rect x="150" y="648" width="22" height="16" rx="8" fill="#EAF7EE" stroke="#2E9E5B" stroke-width="1.6"/><text x="180" y="660" class="body" fill="#1F2933">Input</text><rect x="340" y="648" width="22" height="16" rx="8" fill="#EEF4FF" stroke="#4C7BD9" stroke-width="1.6" stroke-dasharray="5 4"/><text x="370" y="660" class="body" fill="#1F2933">Asks if needed</text><rect x="530" y="648" width="22" height="16" rx="8" fill="#FFF4E5" stroke="#D9822B" stroke-width="1.6"/><text x="560" y="660" class="body" fill="#1F2933">Waits for you</text><rect x="720" y="648" width="22" height="16" rx="8" fill="#F3F4F6" stroke="#B8BDC4" stroke-width="1.6"/><text x="750" y="660" class="body" fill="#1F2933">No input</text><text x="150" y="690" class="body" fill="#5B6470">Every mode asks before overwriting an existing JD, CV or cover letter file. Source of truth: the Modes table in SKILL.md.</text>
</svg>
