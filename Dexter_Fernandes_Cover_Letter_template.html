<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dexter Fernandes - Cover Letter - Company Name Job Title</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#f3f2f2; font-family:Archivo, system-ui, sans-serif; }
  .page {
    width:210mm; min-height:297mm; margin:16px auto; padding:0.5in;
    background:#fff; box-shadow:0 1px 6px rgba(0,0,0,0.12);
  }
  a { color:#201e1d; text-decoration:none; border-bottom:1px solid #bab6b6; }
  a:hover { color:#ae1800; border-bottom-color:#ec3013; }
  @page { size:A4; margin:0.5in; }
  @media print {
    body { background:#fff; }
    .page { width:auto; min-height:0; margin:0; padding:0; box-shadow:none; }
  }
</style>
</head>
<body>
<div class="page">
<div style="color:#201e1d;font-size:12px;line-height:1.55;letter-spacing:0">

<!-- ============ HEADER ============ -->
<h1 style="font-weight:800;font-size:35.8px;line-height:0.95;letter-spacing:-1px;text-transform:uppercase;margin:0 0 8px 0">Dexter Fernandes</h1>
<div style="height:3px;background:#ec3013;margin:0 0 6px 0"></div>
<div style="display:flex;flex-wrap:wrap;gap:4px 14px;font-size:10.8px;font-weight:500;letter-spacing:0.02em;margin:0 0 3px 0">
  <span>Job Title</span>
  <span style="color:#7d7979">Bristol, UK</span>
  <span>+44 7436 007369</span>
  <span><a href="mailto:dexterfernandes11@gmail.com">dexterfernandes11@gmail.com</a></span>
  <span><a href="https://linkedin.com/in/dexterferns">linkedin.com/in/dexterferns</a></span>
  <span><a href="https://github.com/Dexter-Fernandes">github.com/Dexter-Fernandes</a></span>
</div>

<!-- ============ ADDRESSEE ============ -->
<!-- Parent-company span is optional: delete it when the listing names none. -->
<div style="height:2px;background:#201e1d;margin:10px 0 8px 0"></div>
<div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:0 0 12px 0">
  <div>
    <div style="font-size:14.4px;font-weight:800;letter-spacing:-0.2px">Company Name <span style="font-weight:500;color:#444141">, Parent Company</span></div>
    <div style="font-size:11.5px;color:#444141">Job Title, City, Region</div>
  </div>
  <div style="font-size:10.4px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:#ae1800;white-space:nowrap">DD Month YYYY</div>
</div>

<!-- ============ LETTER BODY ============ -->
<!-- One <p> per paragraph. Repeat the paragraph slot as needed. No lists, no numbering. -->
<p style="margin:0 0 10px 0;orphans:3;widows:3">Dear Salutation,</p>

<p style="margin:0 0 10px 0;orphans:3;widows:3">Paragraph text</p>

<p style="margin:0 0 14px 0;orphans:3;widows:3">Paragraph text</p>

<p style="margin:0 0 2px 0">Yours sincerely,</p>
<p style="margin:0;font-weight:700">Dexter Fernandes</p>

</div>
</div>
</body>
</html>
